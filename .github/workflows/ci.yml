name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      # Sin DATABASE_URL las pruebas usan PGlite (PostgreSQL en memoria).
      # Sin ANTHROPIC_API_KEY ni WHATSAPP_ACCESS_TOKEN se usan los simuladores.
      LLM_PROVIDER: mock
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar dependencias (npm ci, reproducible desde el lockfile)
        run: npm ci
      - name: Verificar tipos (tsc --noEmit)
        run: npm run typecheck
      - name: Ejecutar pruebas (Vitest, suite completa)
        run: npm test
