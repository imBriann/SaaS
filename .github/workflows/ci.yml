name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      # Sin DATABASE_URL las pruebas usan PGlite (PostgreSQL en memoria).
      # Sin ANTHROPIC_API_KEY ni WHATSAPP_ACCESS_TOKEN se usan los simuladores.
      LLM_PROVIDER: mock
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Instalar dependencias del servidor (npm ci, reproducible desde el lockfile)
        run: npm ci
      - name: Verificar tipos del servidor (tsc --noEmit; no es un lint completo)
        run: npm run typecheck
      - name: Compilar el cliente web (npm ci + tsc --noEmit + vite build)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Ejecutar pruebas (Vitest, suite completa)
        run: npm test

  # Archivos críticos (aislamiento, acceso, correo, panel del operador, negocio, canal)
  # contra un PostgreSQL real: privilegios por columna, RLS forzada y concurrencia.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    env:
      LLM_PROVIDER: mock
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@v4
      # La contraseña se genera en cada ejecución (no hay credenciales en el repositorio)
      # y se enmascara en los registros. Un bloque `services:` no puede recibir valores
      # generados en pasos previos, por eso se levanta el contenedor aquí.
      - name: Iniciar PostgreSQL 17 con credenciales efímeras
        run: |
          PGPASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PGPASS"
          docker run -d --name pg-ci \
            -e POSTGRES_USER=omnegia \
            -e POSTGRES_PASSWORD="$PGPASS" \
            -e POSTGRES_DB=omnegia_pruebas \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=C" \
            -p 127.0.0.1:5432:5432 \
            postgres:17
          echo "DATABASE_URL_PRUEBAS=postgres://omnegia:${PGPASS}@127.0.0.1:5432/omnegia_pruebas" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            docker exec pg-ci pg_isready -U omnegia -d omnegia_pruebas && exit 0
            sleep 2
          done
          docker logs pg-ci
          exit 1
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar dependencias del servidor
        run: npm ci
      - name: Pruebas críticas sobre PostgreSQL 17
        run: npm run test:postgres
